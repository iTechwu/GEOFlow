name: geoflow-laravel

x-runtime-db-guard: &runtime_db_guard
  AUTO_MIGRATE: "false"
  AUTO_INIT_ONCE: "false"
  AUTO_INSTALL_ONCE: "false"

services:
  assets:
    image: ${NODE_IMAGE:-uhub.service.ucloud.cn/techwu/node:22-bookworm-slim}
    container_name: geoflow-assets
    working_dir: /var/www/html
    command: ["sh", "-lc", "npm ci --include=dev --no-audit --no-fund && npm run build"]
    volumes:
      - ./:/var/www/html
      - geoflow-node-modules:/var/www/html/node_modules
    restart: "no"

  vite:
    image: ${NODE_IMAGE:-uhub.service.ucloud.cn/techwu/node:22-bookworm-slim}
    container_name: geoflow-vite
    working_dir: /var/www/html
    command: ["sh", "-lc", "npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - geoflow-node-modules:/var/www/html/node_modules
    depends_on:
      assets:
        condition: service_completed_successfully
    restart: unless-stopped

  app:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-app
    working_dir: /var/www/html
    environment: *runtime_db_guard
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    volumes:
      - ./:/var/www/html
      - ${GEOFLOW_ENV_FILE:-./.env}:/var/www/html/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      assets:
        condition: service_completed_successfully
    restart: unless-stopped

  queue:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-queue
    working_dir: /var/www/html
    environment: *runtime_db_guard
    command: ["php", "artisan", "queue:work", "redis", "--queue=geoflow,distribution,theme-replication,system-updates,default", "--sleep=1", "--tries=1", "--timeout=300"]
    volumes:
      - ./:/var/www/html
      - ${GEOFLOW_ENV_FILE:-./.env}:/var/www/html/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  scheduler:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-scheduler
    working_dir: /var/www/html
    environment: *runtime_db_guard
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
      - ${GEOFLOW_ENV_FILE:-./.env}:/var/www/html/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  reverb:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-reverb
    working_dir: /var/www/html
    environment: *runtime_db_guard
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_EXPOSE_PORT:-18081}:8080"
    volumes:
      - ./:/var/www/html
      - ${GEOFLOW_ENV_FILE:-./.env}:/var/www/html/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  geoflow-node-modules:
