name: geoflow-laravel

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg18}
    container_name: geoflow-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-geo_flow}
      POSTGRES_USER: ${DB_USERNAME:-geo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geo_password}
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-15432}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./docker-data/dev/postgres}:${POSTGRES_CONTAINER_DATA_DIR:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-geo_user} -d ${DB_DATABASE:-geo_flow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    container_name: geoflow-redis
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    command:
      - /bin/sh
      - -lc
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_EXPOSE_PORT:-16379}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  assets:
    image: ${NODE_IMAGE:-uhub.service.ucloud.cn/techwu/node:25-bookworm-slim}
    container_name: geoflow-assets
    working_dir: /var/www/html
    command: ["sh", "-lc", "npm ci --include=dev --no-audit --no-fund && npm run build"]
    volumes:
      - ./:/var/www/html
      - geoflow-node-modules:/var/www/html/node_modules
    restart: "no"

  vite:
    image: ${NODE_IMAGE:-uhub.service.ucloud.cn/techwu/node:25-bookworm-slim}
    container_name: geoflow-vite
    working_dir: /var/www/html
    command: ["sh", "-lc", "npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - geoflow-node-modules:/var/www/html/node_modules
    depends_on:
      assets:
        condition: service_completed_successfully
    restart: unless-stopped

  init:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-init
    working_dir: /var/www/html
    env_file:
      - ${GEOFLOW_ENV_FILE:-./.env}
    environment:
      GEOFLOW_SECURITY_FRESH_INSTALL_CONFIRMED: "true"
    # 交给 entrypoint 执行自动初始化（生成 APP_KEY / migrate / geoflow:install）
    command: ["php", "artisan", "about"]
    volumes:
      - ./:/var/www/html
      - ${GEOFLOW_ENV_FILE:-./.env}:/var/www/html/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  app:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-app
    working_dir: /var/www/html
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    volumes:
      - ./:/var/www/html
      - ${GEOFLOW_ENV_FILE:-./.env}:/var/www/html/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      assets:
        condition: service_completed_successfully
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  queue:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-queue
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--queue=geoflow,distribution,theme-replication,default", "--sleep=1", "--tries=1", "--timeout=300"]
    volumes:
      - ./:/var/www/html
      - ${GEOFLOW_ENV_FILE:-./.env}:/var/www/html/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-scheduler
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
      - ${GEOFLOW_ENV_FILE:-./.env}:/var/www/html/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  reverb:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-reverb
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_EXPOSE_PORT:-18081}:8080"
    volumes:
      - ./:/var/www/html
      - ${GEOFLOW_ENV_FILE:-./.env}:/var/www/html/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  geoflow-node-modules:
