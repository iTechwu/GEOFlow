# 预构建镜像部署：服务器只 pull 镜像并启动，不执行 Docker build。
# PostgreSQL/Redis are external services managed by docker-helm.dofe.ai.
# 用法：docker compose --env-file .env.prod -f docker-compose.prebuilt.yml up -d
name: geoflow-laravel-prod

services:
  init:
    image: ${GEOFLOW_APP_IMAGE:?GEOFLOW_APP_IMAGE is required for prebuilt deployment}
    container_name: geoflow-init-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    environment:
      GEOFLOW_SECURITY_FRESH_INSTALL_CONFIRMED: "true"
    command: ["php", "artisan", "about"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    restart: "no"

  app:
    image: ${GEOFLOW_APP_IMAGE:?GEOFLOW_APP_IMAGE is required for prebuilt deployment}
    container_name: geoflow-app-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    image: ${GEOFLOW_WEB_IMAGE:?GEOFLOW_WEB_IMAGE is required for prebuilt deployment}
    container_name: geoflow-web-prod
    ports:
      - "${WEB_PORT:-18080}:80"
    volumes:
      - ./storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  queue:
    image: ${GEOFLOW_APP_IMAGE:?GEOFLOW_APP_IMAGE is required for prebuilt deployment}
    container_name: geoflow-queue-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    command: ["php", "artisan", "queue:work", "redis", "--queue=geoflow,distribution,theme-replication,default", "--sleep=1", "--tries=1", "--timeout=300"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -q 'artisan queue:work' && php artisan queue:monitor redis:geoflow,redis:distribution,redis:theme-replication,redis:default --max=1000000 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  scheduler:
    image: ${GEOFLOW_APP_IMAGE:?GEOFLOW_APP_IMAGE is required for prebuilt deployment}
    container_name: geoflow-scheduler-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -q 'artisan schedule:work' && php artisan schedule:list >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  reverb:
    image: ${GEOFLOW_APP_IMAGE:?GEOFLOW_APP_IMAGE is required for prebuilt deployment}
    container_name: geoflow-reverb-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    # 端口由 .env.prod 的 REVERB_SERVER_PORT 决定（见 config/reverb.php）；nginx /reverb 反代端口须与之对齐
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0"]
    ports:
      - "${REVERB_EXPOSE_PORT:-18081}:${REVERB_SERVER_PORT:-18080}"
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -q 'artisan reverb:start' && curl -sS --max-time 2 -o /dev/null http://127.0.0.1:$${REVERB_SERVER_PORT:-8080}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
networks:
  default:
    external: true
    name: ${DOCKER_COMMON_NETWORK_NAME:-common_network}
