# PostgreSQL/Redis are external services managed by docker-helm.dofe.ai.
name: geoflow-laravel-prod

x-prod-app-build-args: &prod_app_build_args
  COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
  PHP_FPM_IMAGE: ${PHP_FPM_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-fpm-bookworm}
  PECL_REDIS_VERSION: ${PECL_REDIS_VERSION:-6.3.0}
  COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
  HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
  HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-${DOCKER_BUILD_HTTP_PROXY:-}}
  NO_PROXY: ${DOCKER_BUILD_NO_PROXY:-localhost,127.0.0.1,::1,dofe-postgres,dofe-redis}

services:
  init:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    container_name: geoflow-init-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    environment:
      GEOFLOW_SECURITY_FRESH_INSTALL_CONFIRMED: "true"
    command: ["php", "artisan", "about"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    restart: "no"

  app:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    container_name: geoflow-app-prod
    working_dir: /var/www/html
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    image: geoflow-web-prod:latest
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: geoflow-web-prod
    ports:
      - "${WEB_PORT:-18080}:80"
    volumes:
      - ./storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  queue:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    container_name: geoflow-queue-prod
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--queue=geoflow,distribution,theme-replication,default", "--sleep=1", "--tries=1", "--timeout=300"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    container_name: geoflow-scheduler-prod
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  reverb:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    container_name: geoflow-reverb-prod
    working_dir: /var/www/html
    # 端口由 .env.prod 的 REVERB_SERVER_PORT 决定（见 config/reverb.php）；nginx /reverb 反代端口须与之对齐
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0"]
    ports:
      - "${REVERB_EXPOSE_PORT:-18081}:${REVERB_SERVER_PORT:-18080}"
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  default:
    external: true
    name: ${DOCKER_COMMON_NETWORK_NAME:-common_network}
