# PostgreSQL/Redis are external services managed by docker-helm.dofe.ai.
name: geoflow-laravel-prod

x-prod-app-build-args: &prod_app_build_args
  COMPOSER_IMAGE: ${COMPOSER_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-cli-bookworm}
  COMPOSER_VERSION: ${COMPOSER_VERSION:-2.10.2}
  COMPOSER_SHA256: ${COMPOSER_SHA256:-471f2d857abf0ec18af7b055e61472214d91adb24f9bdbbb864c1c64faad7dd6}
  PHP_FPM_IMAGE: ${PHP_FPM_IMAGE:-uhub.service.ucloud.cn/techwu/php:8.4-fpm-bookworm}
  PECL_REDIS_VERSION: ${PECL_REDIS_VERSION:-6.3.0}
  PECL_REDIS_SHA256: ${PECL_REDIS_SHA256:-cb8f81df1a275599e4f8ddcfec7e1f65ed1953e6f5673649149fd680ebff4cad}
  COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-https://mirrors.aliyun.com/composer}
  HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
  HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-${DOCKER_BUILD_HTTP_PROXY:-}}
  NO_PROXY: ${DOCKER_BUILD_NO_PROXY:-localhost,127.0.0.1,::1,dofe-postgres,dofe-redis}

# The production images are published for amd64; keep local arm64 runs
# explicit so CI and developer Compose resolve the same platform.
x-prod-platform: &prod_platform linux/amd64

services:
  app:
    platform: *prod_platform
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    container_name: geoflow-app-prod
    working_dir: /var/www/html
    command: ["php-fpm", "-F"]
    ports: !reset []
    env_file:
      - ./.env.prod
    environment:
      AUTO_MIGRATE: "false"
      AUTO_INSTALL_ONCE: "false"
    volumes: !override
      - ./.env.prod:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    depends_on: !reset []
    healthcheck:
      test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -q 'php-fpm' && php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    platform: *prod_platform
    image: geoflow-web-prod:latest
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-uhub.service.ucloud.cn/techwu/nginx:1.31.1-alpine}
    container_name: geoflow-web-prod
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:80"
    volumes:
      - ./storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  queue:
    platform: *prod_platform
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    container_name: geoflow-queue-prod
    working_dir: /var/www/html
    user: "www-data"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ./.env.prod
    environment:
      AUTO_MIGRATE: "false"
      AUTO_INSTALL_ONCE: "false"
    command: ["php", "artisan", "queue:work", "redis", "--queue=geoflow,distribution,theme-replication,system-updates,default", "--sleep=1", "--tries=1", "--timeout=300"]
    volumes: !override
      - ./.env.prod:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    depends_on: !reset []
    healthcheck:
      test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -q 'artisan queue:work' && php artisan queue:monitor redis:geoflow,redis:distribution,redis:theme-replication,redis:system-updates,redis:default --max=1000000 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  scheduler:
    platform: *prod_platform
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    container_name: geoflow-scheduler-prod
    working_dir: /var/www/html
    user: "www-data"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ./.env.prod
    environment:
      AUTO_MIGRATE: "false"
      AUTO_INSTALL_ONCE: "false"
    command: ["php", "artisan", "schedule:work"]
    volumes: !override
      - ./.env.prod:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    depends_on: !reset []
    healthcheck:
      test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -q 'artisan schedule:work' && php artisan schedule:list >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  reverb:
    platform: *prod_platform
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      network: ${DOCKER_BUILD_NETWORK:-default}
      args: *prod_app_build_args
    container_name: geoflow-reverb-prod
    working_dir: /var/www/html
    user: "www-data"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ./.env.prod
    environment:
      AUTO_MIGRATE: "false"
      AUTO_INSTALL_ONCE: "false"
    # 端口由 .env.prod 的 REVERB_SERVER_PORT 决定（见 config/reverb.php）；nginx /reverb 反代端口须与之对齐
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0"]
    ports: !override
      - "127.0.0.1:${REVERB_EXPOSE_PORT:-18081}:${REVERB_SERVER_PORT:-18080}"
    volumes: !override
      - ./.env.prod:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    depends_on: !reset []
    healthcheck:
      test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -q 'artisan reverb:start' && curl -sS --max-time 2 -o /dev/null http://127.0.0.1:$${REVERB_SERVER_PORT:-8080}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  default:
    external: true
    name: ${DOCKER_COMMON_NETWORK_NAME:-common_network}
